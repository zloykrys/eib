---
- name: Generate EIB definition and secrets from templates
  hosts: localhost
  connection: local
  gather_facts: no
  vars_files:
    - secrets.yml
  tasks:
    - name: Ensure kubernetes manifests directory exists
      ansible.builtin.file:
        path: kubernetes/manifests
        state: directory
        mode: '0755'

    - name: Generate random NeuVector exporter password for this build
      ansible.builtin.set_fact:
        neuvector_exporter_password: "{{ neuvector_exporter_password | default(lookup('ansible.builtin.password', '/dev/null length=24 chars=ascii_letters,digits')) }}"

    # 1. Secret named 'neuvector-init' - NeuVector controller automatically reads this on first boot
    - name: Generate NeuVector Controller Init Secret
      ansible.builtin.copy:
        dest: kubernetes/manifests/neuvector-init-secret.yaml
        mode: '0600'
        content: |
          apiVersion: v1
          kind: Secret
          metadata:
            name: neuvector-init
            namespace: cattle-neuvector-system
          type: Opaque
          stringData:
            userinitcfg.yaml: |
              always_reload: true
              users:
                - Fullname: "exporter"   # MUST be 'exporter' so the REST API handle matches
                  Password: "{{ neuvector_exporter_password }}"
                  Role: "reader"
                  Timeout: 300

    - name: Generate NeuVector Exporter Credentials Secret
      ansible.builtin.copy:
        dest: kubernetes/manifests/neuvector-exporter-secret.yaml
        mode: '0600'
        content: |
          apiVersion: v1
          kind: Secret
          metadata:
            name: neuvector-exporter-credentials
            namespace: cattle-neuvector-system
          type: Opaque
          stringData:
            CTRL_USERNAME: "exporter"
            CTRL_PASSWORD: "{{ neuvector_exporter_password }}"

    - name: Render the EIB ISO definition
      ansible.builtin.template:
        src: eib-iso-definition.yaml.j2
        dest: eib-iso-definition.yaml