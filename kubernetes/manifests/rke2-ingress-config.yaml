apiVersion: helm.cattle.io/v1
kind: HelmChartConfig
metadata:
  name: rke2-traefik
  namespace: kube-system
spec:
  failurePolicy: reinstall
  valuesContent: |-
    service:
      enabled: true
      type: LoadBalancer
      labels:
        serviceType: kubernetes-vip
      annotations:
        metallb.universe.tf/allow-shared-ip: "rke2-shared-vip"
        metallb.io/allow-shared-ip: "rke2-shared-vip"
      spec:
        type: LoadBalancer
        externalTrafficPolicy: Cluster